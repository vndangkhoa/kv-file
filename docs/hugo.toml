baseURL = "/"
title = "kv-file Documentation"
contentDir = "content"
enableEmoji = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.100.0"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github-dark"
    guessSyntax = false

[params]
  sans_serif_font = "'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif"
  secondary_font  = "'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif"
  mono_font       = "'Fira Code', monospace"

  website         = "https://vndangkhoa.github.io/kv-file/"

  [params.footer]
    copyright = "© :YEAR: kv-file. Built with [**Lotus Docs**](https://lotusdocs.dev)."

  [params.social]
    github = "https://github.com/vndangkhoa/kv-file"

  [params.docs]
    title           = "kv-file Documentation"
    themeColor      = "blue"
    darkMode        = true
    sidebarIcons    = true
    breadcrumbs     = true
    backToTop       = true
    toc             = true
    tocMobile       = true
    scrollSpy       = true
    descriptions    = true
    titleIcon       = true
    navDesc         = true
    intLinkTooltip  = true

  [params.flexsearch]
    enabled         = true

[menu]
[[menu.primary]]
  name = "Website"
  url = "https://vndangkhoa.github.io/kv-file/"
  weight = 5
[[menu.primary]]
  name = "Docs"
  url = "docs/"
  weight = 10
[[menu.primary]]
  name = "GitHub"
  url = "https://github.com/vndangkhoa/kv-file"
  weight = 20
