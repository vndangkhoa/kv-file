name: Deploy Website & Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Web Landing Site
        run: |
          cd web
          npm ci
          npx vite build --base=/kv-file/

      - name: Build Hugo Documentation
        run: |
          cd docs
          hugo --minify --baseURL "https://vndangkhoa.github.io/kv-file/"

      - name: Assemble GitHub Pages Distribution
        run: |
          mkdir -p site
          # 1. Copy Hugo documentation site (docs/, scss/, js/, index.xml, etc.)
          cp -r docs/public/* site/
          # 2. Copy Vite landing site assets and branding files into site root
          cp -r web/dist/assets site/
          cp -r web/dist/icons site/ || true
          cp -r web/dist/media site/ || true
          cp web/dist/favicon.* site/ || true
          cp web/dist/manifest.* site/ || true
          cp web/dist/sw.js site/ || true
          # 3. Serve landing.html as root index.html (the official product website)
          cp web/dist/landing.html site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
